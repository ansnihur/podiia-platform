# Local database for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: podiia
    ports:
      - "5432:5432"
    volumes:
      - podiia-db:/var/lib/postgresql/data
volumes:
  podiia-db:
