version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventplatform_db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: eventuser
      POSTGRES_PASSWORD: eventpassword
      POSTGRES_DB: eventplatform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eventuser -d eventplatform']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: eventplatform_app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://eventuser:eventpassword@postgres:5432/eventplatform
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: super-secret-nextauth-key-change-in-production
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
